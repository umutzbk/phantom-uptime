<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 32" role="img" aria-label="Phantom Uptime">
  <!-- Mark: a solid status ring that reads healthy, with a dashed inner ring and a
       flat pulse, the trace of a charger that reports Available and delivers nothing. -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#111" stroke-width="3"/>
  <circle cx="16" cy="16" r="8" fill="none" stroke="#E1251B" stroke-width="2" stroke-dasharray="3 2.4"/>
  <path d="M10 16h12" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <text x="40" y="22.5" font-family="Instrument Sans, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="700" letter-spacing="-0.4" fill="#111">Phantom<tspan fill="#E1251B" font-weight="600"> Uptime</tspan></text>
</svg>
