<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phantom Uptime · Reliability Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* One accent, used once. The blind spot is the only thing on the page allowed
   to be a colour; everything else earns attention through weight and space. */
:root{
  --paper:#F4F4F4; --card:#FFFFFF; --card-2:#FAFAFA;
  --ink:#111111; --ink-2:#44474B; --muted:#767A80;
  --rule:#E2E2E2; --rule-2:#EEEEEE;
  --signal:#E1251B; --signal-soft:#FDECEA;
  --good:#1B7A46; --good-soft:#E9F3EC;
  --bar:#000000; --bar-ink:#9BA0A6; --bar-hi:#FFFFFF;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0B0B0C; --card:#151617; --card-2:#1B1C1E; --rule:#2B2C2E; --rule-2:#232426;
  --ink:#F1F1F1; --ink-2:#B6B9BD; --muted:#7E8288;
  --signal:#FF5247; --signal-soft:#2C1210;
  --good:#4FB37B; --good-soft:#11231A;
  --bar:#000000; --bar-ink:#8E9298;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  font-feature-settings:"tnum"}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ------------------------------------------------------------------ top bar */
/* White, because the wordmark is dark grey on white and would vanish on black. */
.bar{position:sticky;top:0;z-index:20;background:#FFFFFF;color:#44474B;
  border-bottom:1px solid #111;
  display:flex;align-items:center;gap:26px;padding:0 26px;height:56px}
.mark{display:flex;align-items:center;gap:11px}
.mark img{height:22px;width:auto;display:block}
.mark .div{width:1px;height:22px;background:#E2E2E2}
.mark small{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:#767A80;font-weight:600}
.tabs{display:flex;gap:2px;margin-left:6px}
.tabs button{padding:7px 14px;border-radius:6px;font-size:13.5px;color:#767A80}
.tabs button:hover{color:#111}
.tabs button[aria-current="true"]{background:#111;color:#fff;font-weight:600}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:11.5px}
.stat{display:flex;align-items:center;gap:7px}
.dot{width:6px;height:6px;border-radius:50%}
.dot.up{background:#3CB371}.dot.down{background:var(--signal)}

.wrap{max-width:1220px;margin:0 auto;padding:26px 26px 80px}
.note-strip{display:flex;gap:11px;align-items:baseline;padding:9px 14px;margin-bottom:26px;
  border:1px solid var(--rule);border-left:2px solid var(--ink-2);border-radius:0 var(--r) var(--r) 0;
  background:var(--card);font-size:12.5px;color:var(--ink-2)}
.note-strip .tag{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;font-weight:600}

.eyebrow{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  font-weight:600}
.lede{color:var(--ink-2);margin-top:11px;max-width:60ch;font-size:14.5px}
section{margin-top:38px}
section > h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  font-weight:600;padding-bottom:9px;border-bottom:1px solid var(--rule);margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r)}
.pad{padding:18px 20px}

/* ------------------------------------------------------------------ overview */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:48px;
  align-items:center;margin-top:6px}
.hero h1{font-size:34px;line-height:1.14;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--signal)}
.venn{width:100%;height:auto}
.venn text{font-family:"Instrument Sans",sans-serif}
.venn .big{font-size:34px;font-weight:700;letter-spacing:-.03em}
.venn .lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.venn .sm{font-size:11.5px}

.figures{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--rule);
  border-radius:var(--r);overflow:hidden;background:var(--rule);gap:1px;margin-top:26px}
.figures > div{background:var(--card);padding:16px 20px 18px}
.figures .k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  font-weight:600}
.figures .v{font-size:30px;font-weight:700;letter-spacing:-.035em;margin:9px 0 7px;line-height:1}
.figures .d{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.figures .flag{background:var(--signal-soft)}
.figures .flag .v{color:var(--signal)}

.anatomy{margin-top:18px;padding:16px 18px;border:1px solid var(--rule);
  border-left:2px solid var(--ink);border-radius:0 var(--r) var(--r) 0;background:var(--card-2)}
.anatomy p{font-size:12.5px;color:var(--ink-2);margin:7px 0 14px;max-width:80ch;line-height:1.6}
.anatomy .metrics{background:var(--rule)}
.metrics.m4{grid-template-columns:repeat(4,1fr)}
.metrics.m3{grid-template-columns:repeat(3,1fr)}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.metrics > div{background:var(--card);padding:14px 16px}
.metrics dt{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  font-weight:600}
.metrics dd{margin:7px 0 0;font-size:22px;font-weight:600;letter-spacing:-.028em;line-height:1}
.metrics dd span{font-size:11px;font-weight:400;color:var(--muted);margin-left:3px;letter-spacing:0}
.metrics .f{margin-top:7px;font-size:10.5px;color:var(--muted);line-height:1.45}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  font-weight:600;padding:11px 14px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--card-2)}
th.r,td.r{text-align:right}
.scroll{overflow-x:auto}
tr.top td{background:var(--signal-soft)}
tr.top:hover td{background:var(--signal-soft)}
tr.top td:first-child{box-shadow:inset 3px 0 0 var(--signal)}
td .s{font-size:11.5px;color:var(--muted);margin-top:1px}
.tag2{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;padding:3px 8px;border-radius:3px;white-space:nowrap}
.tag2.live{background:var(--signal);color:#fff}
.tag2.stop{background:var(--rule-2);color:var(--muted)}
.tag2.ok{background:var(--good-soft);color:var(--good)}
.tag2.hold{border:1px solid var(--signal);color:var(--signal)}
.gate{font-size:12px;line-height:1.55;margin:14px 0 0;padding:9px 12px;border-radius:7px}
.gate.ok{color:var(--muted);background:var(--card-2);border:1px solid var(--rule)}
.gate.bad{color:var(--ink);background:var(--signal-soft);border:1px solid var(--signal)}
.gate .mono{font-size:11.5px}
mark.uns{background:var(--signal-soft);color:var(--ink);
  box-shadow:inset 0 -2px 0 var(--signal);border-radius:2px;padding:0 2px}

.approve-row,.approved{display:flex;gap:11px;align-items:center;flex-wrap:wrap;
  padding:14px 20px;border-top:1px solid var(--rule)}
.approved span:last-child{font-size:12.5px;color:var(--ink-2);flex:1;min-width:240px}

tr.go{cursor:pointer}
tr.go .arrow{color:transparent;transition:color .12s;font-size:15px;width:34px}
tr.go:hover .arrow{color:var(--ink-2)}
tr.go:hover td{background:var(--card-2)}
tr.go.top:hover td{background:var(--signal-soft)}
tr.go.top:hover .arrow{color:var(--signal)}
.cta{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.cta span{font-size:12.5px;color:var(--muted)}

/* ------------------------------------------------------------------ ask */
.askbar{position:sticky;top:56px;z-index:10;background:var(--paper);
  padding:14px 0 16px;border-bottom:1px solid var(--rule);margin-bottom:26px}
.askrow{display:flex;gap:9px;align-items:center}
.askrow input{flex:1;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:11px 15px;font:inherit;color:var(--ink);font-size:14.5px}
.askrow input::placeholder{color:var(--muted)}
.btn{border:1px solid var(--rule);background:var(--card);padding:10px 18px;border-radius:var(--r);
  font-size:13.5px;white-space:nowrap;transition:.12s}
.btn:hover{border-color:var(--ink-2)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:500}
.btn.solid:hover{opacity:.87}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;
  background:var(--card)}
.seg button{padding:10px 15px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{border:1px solid var(--rule);background:var(--card);border-radius:14px;padding:5px 12px;
  font-size:12.5px;color:var(--ink-2);transition:.12s}
.chip:hover{border-color:var(--ink-2);color:var(--ink)}
.chip[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.result{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:30px;align-items:start}
.result.single{display:block;max-width:860px;margin:0 auto}
.blocks{display:flex;flex-direction:column;gap:22px;min-width:0}
.blk{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.blk > header{display:flex;align-items:center;gap:10px;padding:12px 20px;
  border-bottom:1px solid var(--rule);background:var(--card-2)}
.blk > header h3{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  font-weight:600}
.blk > header .meta{margin-left:auto;font-size:11px;color:var(--muted)}
.answer{padding:22px 24px;white-space:pre-wrap;font-size:15px;line-height:1.72;color:var(--ink-2);
  max-width:68ch}
.blank{padding:56px 24px;text-align:center;color:var(--muted)}
.blank .b{font-size:15px;color:var(--ink-2);margin-bottom:7px}

.pair{display:grid;grid-template-columns:1fr 1fr}
.pair > div{padding:18px 20px}
.pair > div:first-child{border-right:1px solid var(--rule)}
.pair h4{margin:0 0 3px;font-size:13.5px;font-weight:600}
.pair .w{font-size:11.5px;color:var(--muted);margin-bottom:14px}
.pair.focus > div:first-child{background:var(--signal-soft)}
.pair.focus > div:first-child h4{color:var(--signal)}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
dl.kv dd.bad{color:var(--signal);font-weight:700}
dl.kv dd.good{color:var(--good)}
.tl{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:11px;
  font-size:12px;padding:4px 0}
.tl .track{height:9px;background:var(--rule-2);border-radius:2px;overflow:hidden}
.tl .fill{height:100%;background:var(--ink-2);border-radius:2px}
.tl .fill.p{background:var(--signal)}
.tl .v{color:var(--muted);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tl .none{color:var(--signal);font-weight:700}
.small{font-size:12.5px;color:var(--ink-2);line-height:1.6;padding:13px 16px;
  background:var(--card-2);border:1px solid var(--rule);border-radius:6px;margin-top:14px}
.approve{display:flex;gap:11px;align-items:flex-start;padding:14px 18px;
  background:var(--signal-soft);border-bottom:1px solid var(--rule);font-size:13px;color:var(--ink-2)}
.approve b{color:var(--signal)}
.mail{white-space:pre-wrap;font-size:13px;line-height:1.68;color:var(--ink-2);padding:18px 20px;
  max-width:76ch}
.subj{font-size:16px;font-weight:600;padding:16px 20px 3px;letter-spacing:-.015em}
.to{font-size:11.5px;color:var(--muted);padding:0 20px 14px;border-bottom:1px solid var(--rule-2)}

/* ------------------------------------------------------------------ thread */
.thread{display:flex;flex-direction:column;gap:26px;min-width:0}
/* Clear the sticky bar when a turn is scrolled to the top, and give the newest
   turn room to get there. Without the reserved height a short answer cannot
   reach the top of the screen and the page refuses to move. */
.turn{scroll-margin-top:74px}
.thread > .turn:last-child{min-height:calc(100vh - 230px)}
.turn{display:flex;flex-direction:column;gap:14px}
.you{align-self:flex-end;max-width:min(72%,620px);background:var(--ink);color:var(--paper);
  padding:12px 17px;border-radius:16px 16px 4px 16px;font-size:14.5px;line-height:1.5}
.said{align-self:flex-end;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:-8px}
.reply{display:flex;flex-direction:column;gap:16px}
.who{display:flex;align-items:center;gap:9px;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);font-weight:600}
.who .avatar{width:20px;height:20px;border-radius:5px;background:var(--ink);display:grid;
  place-items:center}
.who .avatar span{width:5px;height:11px;border-radius:1px;
  background:var(--signal)}
.prose{font-size:15px;line-height:1.75;color:var(--ink-2);max-width:70ch}
.prose p{margin:0 0 14px}
.prose p:last-child{margin-bottom:0}
.prose ul{margin:0 0 14px;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.prose li{display:grid;grid-template-columns:6px 1fr;gap:12px;align-items:start}
.prose li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--muted);
  margin-top:9px}
.prose b.fig{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap}
.prose .id{font-size:.92em;color:var(--ink);background:var(--rule-2);padding:1px 5px;
  border-radius:3px}
.typing{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:13.5px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:blip 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blip{0%,60%,100%{opacity:.25}30%{opacity:1}}

details.fold{border:1px solid var(--rule);border-radius:var(--r);background:var(--card);
  overflow:hidden}
details.fold > summary{list-style:none;cursor:pointer;padding:11px 16px;display:flex;
  align-items:center;gap:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:600;background:var(--card-2)}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::after{content:"+";margin-left:auto;font-size:15px;color:var(--muted);
  font-weight:400;letter-spacing:0}
details.fold[open] > summary::after{content:"−"}
details.fold > summary:hover{color:var(--ink)}
details.fold .in{border-top:1px solid var(--rule)}
.chipcount{font-size:10.5px;color:var(--muted);letter-spacing:0;text-transform:none;
  font-weight:400}

.live{border:1px solid var(--rule);border-radius:var(--r);background:var(--card);
  padding:11px 14px;display:flex;flex-direction:column;gap:8px;max-width:70ch}
.ls{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.ls .lp{width:7px;height:7px;border-radius:50%;background:var(--ink);flex:none}
.ls.now .lp{background:var(--signal);animation:beat 1.1s infinite}
.ls .lm{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);margin-left:8px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .lbl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin-right:2px}
.fu{border:1px solid var(--rule);background:var(--card);border-radius:16px;padding:7px 14px;
  font-size:13px;color:var(--ink-2);transition:.12s}
.fu:hover{border-color:var(--ink);color:var(--ink)}
.fu.act{border-color:var(--signal);color:var(--signal)}
.fu.act:hover{background:var(--signal);color:#fff}

.composer{position:sticky;bottom:0;padding:16px 0 18px;background:var(--paper);
  border-top:1px solid var(--rule);margin-top:22px}
.thread{padding-bottom:4px}
.cbox{display:flex;gap:9px;align-items:center;background:var(--card);border:1px solid var(--rule);
  border-radius:26px;padding:6px 6px 6px 18px;box-shadow:0 2px 14px rgba(20,22,26,.05)}
.cbox input{flex:1;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);
  outline:none;padding:8px 0}
.cbox input::placeholder{color:var(--muted)}
.send{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--paper);
  display:grid;place-items:center;font-size:16px;flex:none}
.send:disabled{opacity:.35}
.cmeta{display:flex;align-items:center;gap:12px;margin-top:9px;font-size:11.5px;color:var(--muted)}

.starter{padding:34px 0 10px}
.starter h2{font-size:22px;letter-spacing:-.025em;border:0;padding:0;margin-bottom:8px;
  text-transform:none;color:var(--ink);font-weight:600}
.starter p{color:var(--ink-2);max-width:56ch;margin-bottom:22px}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:820px}
.scard{text-align:left;border:1px solid var(--rule);background:var(--card);border-radius:var(--r);
  padding:14px 16px;transition:.12s}
.scard:hover{border-color:var(--ink);transform:translateY(-1px)}
.scard .q{font-size:14px;color:var(--ink);font-weight:500;line-height:1.4}
.scard .h{font-size:11.5px;color:var(--muted);margin-top:5px}

/* ------------------------------------------------------------------ trace */
.trace{position:sticky;top:82px}
.trace .hd{padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--card-2);
  font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
.steps{padding:16px}
.step{display:grid;grid-template-columns:16px 1fr;gap:11px;padding-bottom:15px;position:relative}
.step:last-child{padding-bottom:0}
.step:not(:last-child)::before{content:"";position:absolute;left:7.5px;top:18px;bottom:2px;
  width:1px;background:var(--rule)}
.pip{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--rule);background:var(--card);
  z-index:1}
.step.done .pip{border-color:var(--ink);background:var(--ink)}
.step.now .pip{border-color:var(--signal);background:var(--signal);animation:beat 1.1s infinite}
@keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.75);opacity:.45}}
.step .t{font-size:12.5px;font-weight:500;line-height:1.4}
.step .m{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);margin-top:3px;
  line-height:1.5;word-break:break-word}
.step .s2{font-size:10px;color:var(--muted);margin-top:4px}
.trace .foot{padding:12px 16px;border-top:1px solid var(--rule);font-size:11px;color:var(--muted);
  line-height:1.55}
.err{padding:13px 16px;background:var(--signal-soft);border:1px solid var(--signal);
  border-radius:var(--r);color:var(--signal);font-size:13px}

@media(max-width:1040px){
  .hero{grid-template-columns:1fr;gap:26px}
  .result{grid-template-columns:1fr}
  .trace{position:static}
  .metrics{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:860px){
  .metrics.m4{grid-template-columns:repeat(2,1fr)}
}

/* Phones. Desktop above 720px is untouched: everything here is additive.
   The header was the worst of it - brand, tabs and three status chips on one
   56px row meant the second tab was cut off the screen. */
@media(max-width:720px){
  .bar{gap:10px;padding:0 14px;height:auto;min-height:52px;flex-wrap:wrap;
    align-items:center;row-gap:0}
  .mark{flex:0 0 auto}
  .mark img{height:19px}
  .mark .div,.mark small{display:none}
  .tabs{margin-left:auto;gap:4px}

</style>
</head>
<body>
<header class="bar">
  <div class="mark">
    <img src="/static/assets/phantom-uptime.svg" alt="Phantom Uptime" id="brandmark">
    <span class="div"></span><small>Reliability Copilot</small></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="right">
    <span class="stat" id="s-cube"></span>
    <span class="stat" id="s-live"></span>
    <span class="mono" id="s-asof" style="color:var(--muted)"></span>
  </div>
</header>

<div class="wrap">
  <div class="note-strip">
    <span class="tag">Synthetic</span>
    <span><b>Every figure on this screen is generated data.</b>
    This is a capability demonstration built on a synthetic 600-charger pilot estate. It is
    not a finding about any real operator (Voltway Networks is fictional), and nothing here dispatches an
    engineer or sends an email.</span>
  </div>
  <div id="view"></div>
</div>

<script>
/* Approval is state on the turn, not paint on the DOM. Writing it straight to
   innerHTML meant the next render rebuilt the turn from THREAD and the approval
   disappeared, which is the one thing on this screen that must not be forgotten. */
function approve(btn){
  const turn = THREAD[Number(btn.dataset.turn)];
  if(turn) turn.approvedAt = new Date().toLocaleTimeString(
    "en-GB", {hour:"2-digit", minute:"2-digit"});
  render(true);
}

function approvalRow(t, i){
  if(t.approvedAt) return `<div class="approved">
    <span class="tag2 ok">Approved in this session</span>
    <span>Recorded locally at ${esc(t.approvedAt)}. No email was sent, no ticket was
      created and no engineer was dispatched. The recipient is a reserved
      <span class="mono">.example</span> address that cannot receive mail.</span></div>`;
  return `<div class="approve-row">
    <button class="btn solid" data-turn="${i}" onclick="approve(this)">Approve and send</button>
    <button class="btn">Edit draft</button>
    <span style="font-size:12px;color:var(--muted)">Addressed to a reserved
      <span class="mono">.example</span> domain, which cannot receive mail. Nothing leaves
      this machine.</span></div>`;
}

const SEP = "\n" + "\n";
const $ = (i) => document.getElementById(i);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n = (x) => Number(x).toLocaleString("en-GB");
const gbp = (x) => "£" + Number(x).toLocaleString("en-GB", {maximumFractionDigits:0});

/* Same origin when FastAPI serves this file, which is the AWS demo. A frontend
   hosted elsewhere sets window.API_BASE before this script runs. */
const API = (window.API_BASE || "").replace(/\/$/, "");
const api = (path, opts) => fetch(API + path,
  Object.assign({credentials: API ? "include" : "same-origin"}, opts || {}));

let VIEW="overview", DASH=null, QUESTIONS=[], MODE="replay";
let LAST_VIEW=null;                   // so a redraw does not read as a page change

/* The question moves to the top of the viewport and the answer streams in below
   it, so the reader starts at the beginning of the reply instead of being
   dragged along behind its last line. The last turn reserves a screen of space
   underneath so it can reach the top even when the answer is short. */
function showLatestQuestion(){
  const turns = document.querySelectorAll(".turn");
  const last = turns[turns.length - 1];
  // behavior:"auto" on purpose. Smooth scrolling is animated by the browser and
  // some environments simply never run the animation, which leaves the page
  // exactly where it was: the position has to be guaranteed, and a snap that
  // always happens beats a glide that sometimes does not.
  if(last) last.scrollIntoView({block: "start", behavior: "auto"});
}
let THREAD = [];                    // [{question, events, answer, mode, captured, running, error}]
const latest = () => THREAD[THREAD.length-1] || null;

/* "Pilot overview", not "Network overview": this is a synthetic 600-charger
   pilot and the label should not imply the whole estate. */
const TABS=[["overview","Pilot overview"],["investigate","Investigate"]];
TABS.forEach(([id,label])=>{
  const b=document.createElement("button"); b.textContent=label; b.dataset.v=id;
  b.onclick=()=>{VIEW=id;render();}; $("tabs").appendChild(b);
});

let HEALTH=null;

/* The indicator said "Live mode" whatever the toggle was set to, which is the
   one thing on screen that must never be decorative: it tells the room which
   loop they are watching. */
function syncStatus(){
  const cube=$("s-cube"), live=$("s-live");
  if(!cube||!live) return;
  if(!HEALTH){ cube.innerHTML=`<span class="dot down"></span>Backend unreachable`;
               live.innerHTML=""; return; }
  cube.innerHTML=`<span class="dot ${HEALTH.cube.reachable?'up':'down'}"></span>${
    HEALTH.cube.reachable?"Cube connected":"Cube unreachable"}`;
  if(MODE==="replay")
    live.innerHTML=`<span class="dot up"></span>Replay mode`;
  else if(HEALTH.anthropic_key_present)
    live.innerHTML=`<span class="dot up"></span>Live investigation`;
  else
    live.innerHTML=`<span class="dot down"></span>Live unavailable`;
}

async function boot(){
  try{
    const [h,d,q]=await Promise.all([
      fetch("/health").then(r=>r.json()),
      api("/api/dashboard").then(r=>r.json()),
      api("/api/questions").then(r=>r.json())]);
    DASH=d; QUESTIONS=q.questions; HEALTH=h;
    // The observed period's last day, not today. Every figure on this screen and
    // in every answer is computed to this date, so labelling it "data as of"
    // stops it reading as a stale clock.
    $("s-asof").textContent=`data as of ${d.as_of}`;
    $("s-asof").title=`The pilot period ends on this date. Figures are computed to it, `
      + `not to today.`;
  }catch(e){ HEALTH=null; }
  syncStatus();
  render();
}

/* ------------------------------------------------------------------ overview */
function venn(a,b){
  return `<svg class="venn" viewBox="0 0 600 260" role="img"
    aria-label="${a} alerts and ${b} silent failures, with no overlap">
    <circle cx="168" cy="130" r="104" fill="none" stroke="var(--ink-2)" stroke-width="1.5"/>
    <text x="168" y="122" text-anchor="middle" class="big" fill="var(--ink)">${n(a)}</text>
    <text x="168" y="146" text-anchor="middle" class="lbl" fill="var(--muted)">ALERTS RAISED</text>
    <text x="168" y="167" text-anchor="middle" class="sm" fill="var(--muted)">what the team sees</text>

    <circle cx="452" cy="130" r="72" fill="var(--signal-soft)" stroke="var(--signal)"
      stroke-width="1.5"/>
    <text x="452" y="124" text-anchor="middle" class="big" fill="var(--signal)">${n(b)}</text>
    <text x="452" y="147" text-anchor="middle" class="lbl" fill="var(--signal)">SILENT FAILURES</text>
    <text x="452" y="167" text-anchor="middle" class="sm" fill="var(--muted)">what it cannot see</text>

    <line x1="277" y1="130" x2="375" y2="130" stroke="var(--rule)" stroke-width="1"
      stroke-dasharray="3 4"/>
    <text x="326" y="120" text-anchor="middle" class="lbl" fill="var(--muted)">NO</text>
    <text x="326" y="150" text-anchor="middle" class="lbl" fill="var(--muted)">OVERLAP</text>
  </svg>`;
}

function overview(){
  if(!DASH) return `<div class="err">Backend not reachable. Start it with
    <span class="mono">docker compose up -d</span> then
    <span class="mono">uvicorn api.main:app --port 8000</span>.</div>`;
  const b=DASH.blindspot, r=DASH.reliability, t=DASH.top_priority;
  const rows=DASH.portfolio.map(c=>`
    <tr class="go ${c.charger_id==='CHG-0034'?'top':''}" data-fu="Why ${c.charger_id}?"
        title="Investigate ${c.charger_id}">
      <td class="num">${c.dispatch_priority}</td>
      <td class="mono">${esc(c.charger_id)}</td>
      <td>${esc(c.station_name)}<div class="s">${esc(c.city)} · ${esc(c.region)}</div></td>
      <td>${esc(c.failure_pattern.replace(/_/g," "))}</td>
      <td><span class="tag2 ${c.is_ongoing?'live':'stop'}">${c.is_ongoing?'still failing':'stopped'}</span></td>
      <td class="r num">${c.reported_uptime_percent}%</td>
      <td class="r num" style="font-weight:600${
        c.delivered_success_percent < 90 ? ';color:var(--signal)' : ';color:var(--ink-2)'
      }">${c.delivered_success_percent}%</td>
      <td class="r num">${gbp(c.daily_loss_rate_gbp)}</td>
      <td class="r num">${gbp(c.estimated_revenue_at_risk_gbp)}</td>
      <td class="r arrow">&rarr;</td>
    </tr>`).join("");
  return `
  <div class="hero">
    <div>
      <div class="eyebrow">${n(DASH.pilot.chargers)} chargers · ${n(DASH.pilot.stations)} sites · Midlands &amp; North pilot</div>
      <h1 style="margin-top:12px">The alert queue is not empty.<br>It is missing the failures
        that <em>cost the most</em>.</h1>
      <p class="lede">Every alert the operations team works comes from the fault log. A charger
      that never reports a fault never enters that queue, however many drivers it turns away.</p>
      <p class="lede" style="margin-top:14px">An estimated <b style="color:var(--ink)">${gbp(b.hidden_revenue_at_risk_gbp)}</b>
      of revenue at risk over the observed period, none of it on anyone's screen. The
      ${b.still_failing_now} episodes still running are losing
      <b style="color:var(--ink)">${gbp(b.ongoing_daily_loss_rate_gbp)} a day</b> between them.</p>
    </div>
    <div>${venn(b.visible_alert_count, b.silent_failure_count)}</div>
  </div>

  <div class="cta"><button class="btn solid"
      data-fu="Which charger should we send the first engineer to?">
      Ask the copilot where to send the first engineer</button>
    <button class="btn" data-fu="Draft an operations email for ${esc(t.charger_id)}.">
      Draft the action for ${esc(t.charger_id)}</button>
    <span>or select any charger in the table below</span></div>

  <div class="figures">
    <div><div class="k">Alerts in the queue</div><div class="v num">${n(b.visible_alert_count)}</div>
      <div class="d">across ${n(b.visible_alert_device_count)} devices, every one raised from a logged fault</div></div>
    <div><div class="k">Silent failures detected</div><div class="v num">${n(b.silent_failure_count)}</div>
      <div class="d">impaired while status reporting shows them healthy · ${b.still_failing_now} still failing now</div></div>
    <div class="flag"><div class="k">Chargers in both</div><div class="v num">${b.overlap}</div>
      <div class="d">the detection and the alert queue do not intersect at all</div></div>
  </div>

  <section>
    <h2>Reliability, measured two ways</h2>
    <p class="lede" style="margin:-4px 0 16px;max-width:88ch;font-size:13.5px">Reported reliability
    is status-derived uptime. Delivered reliability is based on successful driver charging
    outcomes. They use different denominators; the gap is where status-based monitoring overstates
    the driver experience.</p>
    <dl class="metrics m4">
      <div><dt>Reported</dt><dd class="num">${r.reported_percent}<span>%</span></dd>
        <div class="f">status-derived uptime</div></div>
      <div><dt>Delivered</dt><dd class="num">${r.delivered_percent}<span>%</span></dd>
        <div class="f">attempts that charged</div></div>
      <div><dt>Gap</dt><dd class="num">${r.gap_points}<span>pts</span></dd>
        <div class="f">reported minus delivered</div></div>
      <div><dt>Ongoing run-rate</dt><dd class="num">${gbp(b.ongoing_daily_loss_rate_gbp)}<span>/day</span></dd>
        <div class="f">${gbp(b.ongoing_annualised_gbp)} annualised · extrapolated</div></div>
    </dl>

    <div class="anatomy">
      <div class="eyebrow">Delivered failure anatomy</div>
      <p>These three describe the <b>failure rate</b>, not the gap. Of the
        <b>${r.delivered_failure_rate_points} pts</b> of delivered failure,
        <b>${r.reported_downtime_points} pts</b> is already visible as reported downtime;
        what is left is the <b>${r.gap_points} point</b> gap above. The failure rate is what
        splits into actionable and baseline, so those two do not add up to the gap. Each
        figure is rounded on its own, so the decimals will not subtract exactly.</p>
      <dl class="metrics m3">
        <div><dt>Delivered failure rate</dt>
          <dd class="num">${r.delivered_failure_rate_points}<span>pts</span></dd>
          <div class="f">attempts that did not charge</div></div>
        <div><dt>Actionable</dt><dd class="num">${r.actionable_points}<span>pts</span></dd>
          <div class="f">on the detected chargers</div></div>
        <div><dt>Baseline</dt><dd class="num">${r.baseline_points}<span>pts</span></dd>
          <div class="f">diffuse, not dispatchable</div></div>
      </dl>
    </div>
  </section>

  <section>
    <h2>Where the first engineer goes</h2>
    <p class="lede" style="margin:-4px 0 16px;max-width:88ch;font-size:13.5px">Ranked by what is
    still costing money today. An episode that has stopped is already sunk; one that is running is
    what fixing it today prevents. Top of the list: <b style="color:var(--ink)">${esc(t.charger_id)}</b>
    at ${esc(t.station_name)}.</p>
    <div class="card scroll"><table>
      <thead><tr><th>#</th><th>Charger</th><th>Site</th><th>Pattern</th><th>Status</th>
        <th class="r">Reported uptime</th><th class="r">Delivered</th><th class="r">Loss / day</th>
        <th class="r">At risk</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <p style="margin-top:12px;font-size:12px;color:var(--muted)">Revenue figures are estimates for
    operational prioritisation, not accounting-grade lost revenue.</p>
  </section>`;
}

/* ------------------------------------------------------------------ investigate */
/* The logo is served by the API, so a remotely hosted frontend has to ask for
   it there too. */
if (API) { const m = document.getElementById("brandmark"); if (m) m.src = API + m.getAttribute("src"); }

const toolResult = (turn, name) =>
  (turn.events.find(e => e.type==="tool_call" && e.tool===name)||{}).result;
const called = (turn, name) => turn.events.some(e => e.type==="tool_call" && e.tool===name);

/* ------------------------------------------------------------- number gate
   Computed on the server, in api/figure_check.py, and sent as an event. The
   browser only renders the verdict: one implementation, and an API caller gets
   the same check a viewer does. */
function numberGate(t){
  const e = t.events.find(x => x.type === "figure_check");
  if(!e) return null;
  return {checked: e.checked, bad: e.unsourced || [], tools: e.tools};
}

/* Wrap the unmatched spans in sentinels the renderer turns into marks. The
   offsets come from the server, so the right "43" is marked rather than every
   43 in the paragraph. */
function flagSpans(text, spans){
  if(!spans || !spans.length) return text;
  const ordered = spans.slice().sort((a,b) => a.start - b.start);
  let out = "", last = 0;
  ordered.forEach(sp => {
    if(sp.start < last) return;
    out += text.slice(last, sp.start) + "\u0001" + text.slice(sp.start, sp.end) + "\u0002";
    last = sp.end;
  });
  return out + text.slice(last);
}

/* Answer prose. Figures a director would repeat get weight; identifiers get the
   mono treatment. Everything else stays quiet so the numbers carry. */
function prose(text){
  const inline = (t) => esc(t)
    .replace(/\b(CHG-\d+|STN-\d+|CON-\d+)\b/g, '<span class="mono id">$1</span>')
    .replace(/(£\s?[\d,]+(?:\.\d+)?)/g, '<b class="fig">$1</b>')
    .replace(/(\d[\d,]*(?:\.\d+)?\s?(?:%|pts\b|percentage points|kWh|kW\b|MWh))/gi,
             '<b class="fig">$1</b>')
    .replace(/\u0001/g, '<mark class="uns">').replace(/\u0002/g, '</mark>');
  return text.trim().split(/\n{2,}/).map(block => {
    const lines = block.split("\n");
    if(lines.every(l => /^\s*[-–•]\s+/.test(l)))
      return "<ul>" + lines.map(l =>
        `<li><span>${inline(l.replace(/^\s*[-–•]\s+/,""))}</span></li>`).join("") + "</ul>";
    return `<p>${inline(block)}</p>`;
  }).join("");
}

/* What to offer next, decided by what the agent just did. */
/* The charger this turn was actually about, so a follow-up never names a
   different unit from the one on screen. */
function subjectCharger(turn){
  const ev = toolResult(turn,"get_charger_evidence");
  if(ev && ev.metrics && ev.metrics.charger_id) return ev.metrics.charger_id;
  const im = toolResult(turn,"estimate_commercial_impact");
  if(im && im.metrics && im.metrics.charger_id) return im.metrics.charger_id;
  const sf = toolResult(turn,"find_silent_failures");
  if(sf && sf.metrics && sf.metrics.chargers && sf.metrics.chargers.length)
    return sf.metrics.chargers[0].charger_id;
  return null;
}

function followUps(turn){
  const out = [];
  const add = (q, act) => { if(!out.some(o=>o.q===q)) out.push({q, act:!!act}); };
  const cid = subjectCharger(turn);
  if(called(turn,"find_silent_failures") || called(turn,"get_alert_blindspot")){
    if(cid) add(`Why ${cid}?`);
    add("What is the commercial impact?");
  }
  if(called(turn,"get_charger_evidence") && !called(turn,"estimate_commercial_impact"))
    add("What is the commercial impact?");
  if(cid && !called(turn,"draft_ops_action")
     && (called(turn,"estimate_commercial_impact") || called(turn,"get_charger_evidence")))
    add(`Draft an operations email for ${cid}.`, true);
  if(called(turn,"draft_ops_action")) add("What would I tell the Commercial Director?");
  if(called(turn,"get_reported_reliability") || called(turn,"get_delivered_reliability"))
    add("Which chargers are missing from the alert queue?");
  if(!out.length){ add("Which charger should we send the first engineer to?");
                   add("What is the commercial impact?"); }
  return out.slice(0,3);
}

function fold(title, count, inner, open){
  return `<details class="fold"${open?" open":""}><summary>${esc(title)}
    ${count?`<span class="chipcount">${esc(count)}</span>`:""}</summary>
    <div class="in">${inner}</div></details>`;
}

function bReliability(t){
  const g=(toolResult(t,"get_gap_anatomy")||{}).metrics; if(!g) return "";
  return fold("Reliability figures behind this answer","Cube metrics",
    `<dl class="metrics" style="border:0;border-radius:0">
      <div><dt>Reported</dt><dd class="num">${g.reported_reliability_percent}<span>%</span></dd></div>
      <div><dt>Delivered</dt><dd class="num">${g.delivered_reliability_percent}<span>%</span></dd></div>
      <div><dt>Gap</dt><dd class="num">${g.reliability_gap_points}<span>pts</span></dd></div>
      <div><dt>Failure rate</dt><dd class="num">${g.delivered_failure_rate_points}<span>pts</span></dd></div>
      <div><dt>Actionable</dt><dd class="num">${g.failure_points_from_detected_devices}<span>pts</span></dd></div>
      <div><dt>Baseline</dt><dd class="num">${g.failure_points_baseline_diffuse}<span>pts</span></dd></div>
    </dl>
    <div style="padding:13px 20px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule)">
      The split is of the failure rate, not the gap: failure rate minus reported downtime equals
      the reported-versus-delivered gap.</div>`, true);
}

function bPortfolio(t){
  const s=(toolResult(t,"find_silent_failures")||{}).metrics;
  if(!s || !s.chargers || !s.chargers.length) return "";
  const rows=s.chargers.slice(0,6).map(c=>`
    <tr class="${c.charger_id==='CHG-0034'?'top':''}">
      <td class="num">${c.dispatch_priority}</td><td class="mono">${esc(c.charger_id)}</td>
      <td>${esc(c.station_name)}</td><td>${esc(c.failure_pattern.replace(/_/g," "))}</td>
      <td><span class="tag2 ${c.is_ongoing?'live':'stop'}">${c.is_ongoing?'still failing':'stopped'}</span></td>
      <td class="r num">${gbp(c.daily_loss_rate_gbp)}</td></tr>`).join("");
  return fold("Chargers this answer is about", `${s.returned} returned`,
    `<div class="scroll"><table><thead><tr><th>#</th><th>Charger</th><th>Site</th><th>Pattern</th>
      <th>Status</th><th class="r">Loss / day</th></tr></thead><tbody>${rows}</tbody></table></div>`,
    true);
}

function bEvidence(t){
  const e=toolResult(t,"get_charger_evidence"); if(!e) return "";
  const m=e.metrics,p=m.peer_comparison,c=m.full_period_context;
  const tl=e.evidence.status_timeline||[], sm=m.status_minutes||{};
  const minsOf=st=>Math.round(sm[st.toLowerCase()]||0);
  const max=Math.max(...["Available","Preparing","Charging"].map(minsOf),1);
  const bars=["Available","Preparing","Charging"].map(st=>{
    const row=tl.find(x=>x.status===st), mins=minsOf(st);
    return `<div class="tl"><span style="color:var(--ink-2)">${st}</span>
      <span class="track"><span class="fill ${st==='Preparing'?'p':''}"
        style="width:${mins?Math.max(1.5,(mins/max)*100):0}%"></span></span>
      <span class="v">${mins?n(mins)+" min · "+(row?row.transitions:0)+"×"
        :'<span class="none">never reached</span>'}</span></div>`;}).join("");
  const draftBtn = called(t,"draft_ops_action") ? "" :
    `<div style="padding:14px 20px;border-top:1px solid var(--rule);display:flex;gap:11px;
      align-items:center;flex-wrap:wrap">
      <button class="btn solid" data-fu="Draft an operations email for ${esc(m.charger_id)}.">
        Draft an operations action for ${esc(m.charger_id)}</button>
      <span style="font-size:12px;color:var(--muted)">Produces an email and ticket draft for
        your approval. Nothing is sent.</span></div>`;
  return fold(`Evidence · ${m.charger_id} at ${m.station_name}`,"two windows, kept separate",
    `<div class="pair focus">
      <div><h4>Active episode</h4>
        <p class="w">${esc(m.detection.observed_start)} to ${esc(m.detection.observed_end)} · the detected failure window</p>
        <dl class="kv">
          <dt>Charging attempts</dt><dd>${n(m.attempted_sessions)}</dd>
          <dt>Successful</dt><dd class="${m.successful_sessions?'':'bad'}">${m.successful_sessions}</dd>
          <dt>Energy delivered</dt><dd class="${m.kwh_delivered?'':'bad'}">${m.kwh_delivered} kWh</dd>
          <dt>Delivered success</dt><dd class="${
            m.delivered_success_percent < p.peer_delivered_success_percent - 15 ? 'bad':''
            }">${m.delivered_success_percent}%</dd>
          <dt>Reported uptime</dt><dd>${m.reported_uptime_percent}%</dd>
          <dt>Fault events</dt><dd>${m.fault_events}</dd>
          <dt>Operational alerts</dt><dd>${m.alerts_raised}</dd>
          <dt>Same-site peers</dt><dd class="good">${p.peer_delivered_success_percent}%</dd></dl>
        <div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:9px">Status time in this window</div>${bars}</div>
        <div class="small">${esc(m.charging_minutes_note)} Last successful charge started
          <span class="mono">${esc(m.last_successful_charge_started)}</span>${
          m.episode_delivered_nothing ? ". Nothing has charged since." : "."}</div></div>
      <div><h4>Full 30-day context</h4>
        <p class="w">${esc((m.full_period_window||{}).start||"")} to ${
          esc((m.full_period_window||{}).end||"")} · the whole observed month</p>
        <dl class="kv">
          <dt>Charging attempts</dt><dd>${n(c.attempted_sessions)}</dd>
          <dt>Successful</dt><dd class="good">${n(c.successful_sessions)}</dd>
          <dt>Energy delivered</dt><dd>${n(c.kwh_delivered)} kWh</dd>
          <dt>Delivered success</dt><dd class="good">${c.delivered_success_percent}%</dd></dl>
        <div class="small">The charger performed normally for most of the month. This is a recent
          failure, not a chronically weak unit, which is why an average over thirty days hides it.</div>
        <div class="small">The absence of a fault or an alert is evidence about the monitoring,
          not evidence that the charger is healthy.</div></div></div>${draftBtn}`, true);
}

function bImpact(t){
  const i=(toolResult(t,"estimate_commercial_impact")||{}).metrics;
  if(!i||!i.this_charger) return "";
  const c=i.this_charger, rr=i.run_rate_estimate, a=i.all_detected_failures;
  return fold(`Commercial impact · ${i.charger_id}`,
    `${i.observed_window.start} to ${i.observed_window.end}`,
    `<div class="pair">
      <div><h4>Observed</h4><p class="w">measured over the episode</p>
        <dl class="kv">
          <dt>Estimated lost sessions</dt><dd>${c.estimated_lost_sessions}</dd>
          <dt>Estimated lost energy</dt><dd>${n(c.estimated_lost_kwh)} kWh</dd>
          <dt>Revenue at risk</dt><dd class="bad">${gbp(c.observed_revenue_at_risk_gbp)}</dd>
          <dt>Loss rate</dt><dd class="bad">${gbp(c.daily_loss_rate_gbp)} / day</dd>
          <dt>Confidence</dt><dd>${esc(i.confidence)}</dd></dl></div>
      <div><h4>Extrapolated</h4><p class="w">if it stays unrepaired · not a measurement</p>
        <dl class="kv">
          <dt>This charger, monthly</dt><dd>${gbp(rr.charger_monthly_gbp)}</dd>
          <dt>This charger, annualised</dt><dd>${gbp(rr.charger_annualised_gbp)}</dd>
          <dt>All ongoing, daily</dt><dd>${gbp(rr.ongoing_portfolio_daily_gbp)}</dd>
          <dt>All ongoing, annualised</dt><dd>${gbp(rr.ongoing_portfolio_annualised_gbp)}</dd>
          <dt>Detected portfolio</dt><dd>${a.device_count} chargers</dd></dl>
        <div class="small">Only episodes still running are projected forward. A closed episode is
          not costing anything today.</div></div></div>
    <div style="padding:13px 20px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--muted)">
      Estimate for operational prioritisation, not an accounting-grade lost-revenue calculation.</div>`,
    true);
}

function bAction(t, i){
  const a=(toolResult(t,"draft_ops_action")||{}).metrics; if(!a) return "";
  if(a.drafted===false) return `<div class="blk">
    <header><h3>No action drafted</h3><span class="meta">${esc(a.charger_id)}</span></header>
    <div class="pad" style="font-size:13.5px;color:var(--ink-2);line-height:1.65;max-width:70ch">
      ${esc(a.reason)}</div></div>`;
  const tk=a.ticket_draft;
  return `<div class="blk">
    <header><h3>Recommended action</h3><span class="meta">drafted, not sent</span></header>
    <div class="approve"><b>Requires human approval.</b>
      <span>Nothing has been sent, no ticket created, no engineer dispatched. Every figure in the
      draft came from the tools above.</span></div>
    <div class="subj">${esc(a.subject)}</div>
    <div class="to">to ${esc(a.to.join(", "))} · cc ${esc(a.cc.join(", "))}</div>
    <div class="mail">${esc(a.body)}</div>
    ${approvalRow(t, i)}
    <div class="in" style="border-top:1px solid var(--rule)">
      <div class="pad"><div class="eyebrow" style="margin-bottom:10px">Maintenance ticket draft</div>
      <dl class="kv" style="max-width:600px">
        <dt>Queue</dt><dd class="mono">${esc(tk.queue)}</dd>
        <dt>Priority</dt><dd class="mono">${esc(tk.priority)}</dd>
        <dt>Summary</dt><dd style="text-align:left;font-weight:400">${esc(tk.summary)}</dd>
        <dt>Action</dt><dd style="text-align:left;font-weight:400">${esc(tk.recommended_action)}</dd>
      </dl></div></div></div>`;
}

/* While a turn is in flight its progress belongs beside that turn, not in a
   rail pinned to the newest one - that put CHG-0034 tool calls next to an
   answer about network reliability. */
function liveSteps(t){
  const evts = t.events.filter(e => e.type==="tool_call" || e.type==="thought");
  const items = evts.map(e => e.type==="tool_call"
    ? `<div class="ls done"><span class="lp"></span><span>${esc(e.tool)}<span class="lm">${
        esc(Object.keys(e.arguments||{}).length?JSON.stringify(e.arguments):"")}</span></span></div>`
    : `<div class="ls done"><span class="lp"></span><span>Planning the investigation</span></div>`
  ).join("");
  return `<div class="live">${items}<div class="ls now"><span class="lp"></span>
    <span>${evts.length?"Composing the answer":"Planning the investigation"}</span></div></div>`;
}

function gateLine(g){
  if(!g || !g.checked) return "";
  if(!g.bad.length) return `<div class="gate ok">All ${g.checked} figures in this answer
    matched a value returned by the tools.</div>`;
  return `<div class="gate bad"><b>${g.bad.length} figure${g.bad.length===1?"":"s"} could not be
    matched to any tool result</b>, marked in the text above. The tools were asked for the
    answer; ${g.bad.length===1?"this figure was":"these figures were"} not among what they
    returned, so treat ${g.bad.length===1?"it":"them"} as unverified:
    ${g.bad.map(b=>`<span class="mono">${esc(b.text)}</span>`).join(", ")}.</div>`;
}

function turnHTML(t, i){
  const gate = (!t.running && t.answer) ? numberGate(t) : null;
  const pill = !t.mode ? '<span class="tag2">Investigating</span>'
    : t.mode==="replay"
    ? '<span class="tag2 hold">Replay of captured live investigation</span>'
    : '<span class="tag2 ok">Live investigation</span>';
  const done = t.events.find(e=>e.type==="done");
  const blocks=[bReliability(t),bPortfolio(t),bEvidence(t),bImpact(t),bAction(t,i)]
    .filter(Boolean).join("");
  const calls = t.events.filter(e=>e.type==="tool_call");
  const own = (!t.running && calls.length) ? fold("How this answer was produced",
    `${calls.length} approved tool call${calls.length===1?"":"s"}`,
    `<div class="steps" style="padding:14px 16px">` + calls.map(c=>
      `<div class="step done"><span class="pip"></span><div>
        <div class="t">${esc(c.tool)}</div>
        <div class="m">${esc(Object.keys(c.arguments||{}).length
          ? JSON.stringify(c.arguments) : "no arguments")}</div>
        <div class="s2">Cube semantic layer \u00b7 ${c.ms}ms${
          c.as_of?` \u00b7 as of ${c.as_of}`:""}</div></div></div>`).join("") +
    `</div><div style="padding:11px 16px;border-top:1px solid var(--rule);font-size:11.5px;
      color:var(--muted)">No ad-hoc SQL, no access to raw operational tables, no figure
      invented by the model.</div>`, false) : "";
  const fu = (!t.running && t.answer) ? `<div class="actions">
      <span class="lbl">Next</span>${followUps(t).map(f=>
        `<button class="fu ${f.act?'act':''}" data-fu="${esc(f.q)}">${esc(f.q)}</button>`).join("")}
    </div>` : "";
  return `<div class="turn">
    <div class="said">You asked</div>
    <div class="you">${esc(t.question)}</div>
    <div class="reply">
      <div class="who"><span class="avatar"><span></span></span>Reliability Copilot ${pill}
        <span style="margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none;
          font-size:11px">${done?`${done.turns} turns · ${done.elapsed_s}s`:""}${
          t.captured?` · captured ${esc(t.captured).replace("T"," ").slice(0,16)}`:""}</span></div>
      ${t.error?`<div class="err">${esc(t.error)}</div>`:""}
      ${t.notice?`<div class="small" style="margin:0">${esc(t.notice)}</div>`:""}
      ${t.running?liveSteps(t):""}
      <div class="prose">${t.answer?prose(flagSpans(t.answer,(gate||{}).bad))
        :'<span class="typing"><i></i><i></i><i></i> working through the investigation</span>'}</div>
      ${gateLine(gate)}
      ${blocks}${own}${fu}
    </div></div>`;
}

function starter(){
  const hints={
    "What is our reliability this month?":"reported vs delivered, both from Cube",
    "Why is reported reliability different from delivered reliability?":"the two denominators",
    "Which chargers are missing from the alert queue?":"the blind spot, ranked",
    "Which charger should we send the first engineer to?":"dispatch priority",
    "Why CHG-0034?":"full evidence for one unit",
    "What is the commercial impact?":"observed and extrapolated",
    "Draft an operations email for CHG-0034.":"drafted for approval",
    "What would I tell the Commercial Director?":"the one-minute version",
  };
  return `<div class="starter">
    <h2>What would you like to look into?</h2>
    <p>Ask anything about the pilot estate. The copilot plans an investigation, calls approved
    tools, and shows you the evidence and the action alongside the answer.</p>
    <div class="sgrid">${QUESTIONS.map((q,i)=>
      `<button class="scard" data-q="${i}"><div class="q">${esc(q.question)}</div>
        <div class="h">${esc(hints[q.question]||"")}</div></button>`).join("")}</div>
  </div>`;
}

function investigate(){
  const body = THREAD.length
    ? `<div class="thread">${THREAD.map(turnHTML).join("")}</div>`
    : starter();
  const busy = THREAD.some(t=>t.running);
  return `<div class="result single">
    <div style="min-width:0">
      ${body}
      <div class="composer">
        <div class="cbox">
          <input id="q" placeholder="${THREAD.length?'Ask a follow-up…':'Ask about reliability, a charger, or what to do next…'}"${busy?" disabled":""}>
          <button class="send" id="go" ${busy?"disabled":""} aria-label="Investigate">↑</button>
        </div>
        <div class="cmeta">
          <div class="seg">
            <button data-mode="replay" aria-pressed="${MODE==='replay'}">Replay</button>
            <button data-mode="live" aria-pressed="${MODE==='live'}">Live</button>
          </div>
          <span>${MODE==='replay'
            ? 'Replaying captured live investigations: same loop, same data, recorded.'
            : 'Calling Claude and the tools for real. 10–20 seconds per question.'}</span>
          ${THREAD.length?`<button class="btn" style="margin-left:auto;padding:6px 12px;
            font-size:12px" id="clear">New investigation</button>`:""}
        </div>
      </div>
    </div>
  </div>`;
}

/* ------------------------------------------------------------------ ask */
async function ask(question){
  VIEW="investigate";
  const history = THREAD.filter(t=>t.answer).map(t=>({question:t.question, answer:t.answer}));
  // mode stays unknown until the first event says which it was: asking for a
  // replay does not guarantee one exists.
  const T = {question, events:[], answer:"", running:true, mode:null, captured:null,
             error:null, notice:null};
  THREAD.push(T);
  render();
  // Asking is a request to watch what happens next, so re-arm the follow and
  // move down to the new turn.
  // Called straight after render, not on an animation frame: requestAnimationFrame
  // is throttled in a background tab, and a scroll that silently does not happen
  // is exactly the bug this replaced.
  showLatestQuestion();
  try{
    const res=await api("/api/chat/stream",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question, mode:MODE, history})});
    const rd=res.body.getReader(), dec=new TextDecoder(); let buf="";
    while(true){
      const {done,value}=await rd.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split(SEP); buf=parts.pop();
      for(const pt of parts){
        const line=pt.replace(/^data:\s?/,""); if(!line.trim()) continue;
        let e; try{e=JSON.parse(line);}catch{continue;}
        if(e.type==="answer") T.answer+=(T.answer?"\n\n":"")+e.text;
        if(e.type==="error") T.error=e.message;
        if(e.type==="notice") T.notice=e.message;
        if(e.mode) T.mode=e.mode;
        if(e.captured_at) T.captured=e.captured_at;
        T.events.push(e);
        paint(true);
      }
    }
  }catch(err){ T.error=String(err); }
  T.running=false; paint(true);
}

/* A failed repaint is a bug in the view, not a failed investigation. Log it and
   keep consuming the stream, so the answer still lands. */
function paint(partial){
  try{ render(partial); }catch(err){ console.error("render failed", err); }
}

function wire(v){
  v.querySelectorAll("[data-q]").forEach(el=>el.onclick=()=>ask(QUESTIONS[+el.dataset.q].question));
  v.querySelectorAll("[data-fu]").forEach(el=>el.onclick=()=>ask(el.dataset.fu));
  v.querySelectorAll("[data-mode]").forEach(el=>el.onclick=()=>{MODE=el.dataset.mode;render();});
  const go=$("go"), q=$("q"), clear=$("clear");
  const fire=()=>{const t=q.value.trim(); if(t){ q.value=""; ask(t); }};
  if(go) go.onclick=fire;
  if(q) q.onkeydown=(e)=>{ if(e.key==="Enter") fire(); };
  if(clear) clear.onclick=()=>{ THREAD=[]; render(); };
}

function render(partial){
  syncStatus();
  document.querySelectorAll("#tabs button").forEach(b=>
    b.setAttribute("aria-current", b.dataset.v===VIEW));
  const v=$("view");
  if(partial && VIEW==="investigate" && v.querySelector(".thread")){
    v.querySelector(".thread").innerHTML=THREAD.map(turnHTML).join("");
    const busy=THREAD.some(t=>t.running), go=$("go"), q=$("q");
    if(go) go.disabled=busy;
    if(q) q.disabled=busy;
    wire(v);
    return;
  }
  v.innerHTML = VIEW==="overview" ? overview() : investigate();
  wire(v);
  // Only when the surface itself changes. A redraw of the thread you are
  // already reading should leave you where you are.
  if(!partial && VIEW !== LAST_VIEW) window.scrollTo({top:0, behavior:"instant"});
  LAST_VIEW = VIEW;
}
boot();
</script>
</body>
