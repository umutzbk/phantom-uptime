<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phantom Uptime · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{ --paper:#F4F4F4; --card:#FFF; --ink:#111; --ink-2:#44474B; --muted:#767A80;
       --rule:#E2E2E2; --signal:#E1251B; --signal-soft:#FDECEA; }
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);
  color:var(--ink);font-family:"Instrument Sans",-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.55;padding:24px}
.card{width:100%;max-width:392px;background:var(--card);border:1px solid var(--rule);
  border-radius:8px;overflow:hidden}
.hd{padding:22px 26px 0}
.hd img{height:24px;width:auto;display:block}
.hd .t{margin-top:16px;font-size:19px;font-weight:600;letter-spacing:-.02em}
.hd .s{margin-top:5px;font-size:13px;color:var(--muted)}
form{padding:20px 26px 24px}
label{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin:14px 0 5px}
input{width:100%;padding:10px 12px;font:inherit;color:var(--ink);background:#fff;
  border:1px solid var(--rule);border-radius:6px}
input:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
button{width:100%;margin-top:20px;padding:11px 14px;font:inherit;font-weight:600;
  color:#fff;background:var(--ink);border:0;border-radius:6px;cursor:pointer}
button:hover{background:#000}
.err{margin-top:16px;padding:9px 12px;border:1px solid var(--signal);
  background:var(--signal-soft);border-radius:6px;font-size:12.5px}
.note{padding:13px 26px;border-top:1px solid var(--rule);background:#FAFAFA;
  font-size:11.5px;color:var(--muted);line-height:1.5}
.note b{color:var(--ink-2)}
</style>
</head>
<body>
  <div class="card">
    <div class="hd">
      <img src="/static/assets/phantom-uptime.svg" alt="Phantom Uptime">
      <div class="t">Reliability Copilot</div>
      <div class="s">This demonstration is not public. Please sign in.</div>
    </div>
    <form method="post" action="/login">
      <label for="u">Username</label>
      <input id="u" name="username" autocomplete="username" autofocus required>
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <!--ERROR-->
      <button type="submit">Sign in</button>
    </form>
    <div class="note"><b>Synthetic scenario.</b> Voltway Networks is a fictional operator. All data,
      metrics and findings behind this screen are generated, and no real operator or
      customer data is used.</div>
  </div>
</body>
</html>
